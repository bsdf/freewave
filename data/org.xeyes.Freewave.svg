<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Keep this comment inside the svg element: gdk-pixbuf sniffs only the
       start of the file for a format signature, and a header long enough to
       push the opening tag past that window makes appstreamcli reject the icon
       as "Unrecognized image file format" while librsvg and Qt still read it.

       Papirus-style plate carrying the FW wave/cross unit from ui/fwmark.cc:
       30%-radius squircle over a 112px design area with 8px margins, one flat
       fill, and hard shadows offset rather than blurred. No gradients, filters,
       masks or clip-paths — Qt's SVG renderer silently ignores clip-path, and
       the rest are off-style for the theme.

       The wave runs edge to edge and is cut flush without a clip: its endpoints
       sit exactly on x 8 and x 120, where the tangent is horizontal, so a butt
       cap cuts vertically. Both caps land on the straight part of the plate
       edge, and so does the offset shadow copy. Moving the endpoints, widening
       the stroke, or switching the caps to round puts artwork outside the plate.

       Drawn at 2x the 64px Papirus design size so every wave coordinate stays a
       whole number. rx and the highlight arc are exact and must not be rounded,
       or the highlight stops tracking the plate edge. The crossing strand
       carries its own offset shadow: a single grouped silhouette casts nothing
       onto the strand beneath it and flattens the weave. -->
  <rect style="opacity:0.2" x="8" y="10" width="112" height="112" rx="33.6" ry="33.6"/>
  <rect style="fill:#b24d7a" x="8" y="8" width="112" height="112" rx="33.6" ry="33.6"/>

  <g style="opacity:0.2" transform="translate(0,2)" fill="none" stroke="#000000"
     stroke-width="16" stroke-linejoin="round" stroke-linecap="butt">
    <path d="M 8,50 C 20,50 34,76 46,76 S 70,50 82,50 S 108,76 120,76"/>
    <path d="M 46,50 C 58,50 70,76 82,76" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linejoin="round">
    <path d="M 8,50 C 20,50 34,76 46,76 S 70,50 82,50 S 108,76 120,76"
          stroke="#ffffff" stroke-width="16" stroke-linecap="butt"/>
    <path d="M 46,50 C 58,50 70,76 82,76"
          stroke="#b24d7a" stroke-width="26" stroke-linecap="round"/>
    <path d="M 46,50 C 58,50 70,76 82,76" style="opacity:0.2"
          stroke="#000000" stroke-width="16" stroke-linecap="round" transform="translate(0,2)"/>
    <path d="M 46,50 C 58,50 70,76 82,76"
          stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>

  <path style="opacity:0.1;fill:#ffffff" d="M 41.6 8 C 22.987162 8 8 22.987162 8 41.6 L 8 43.6 C 8 24.987162 22.987162 10 41.6 10 L 86.4 10 C 105.012838 10 120 24.987162 120 43.6 L 120 41.6 C 120 22.987162 105.012838 8 86.4 8 L 41.6 8 z"/>
</svg>
